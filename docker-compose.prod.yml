version: "3.8"

services:
  trunk:
    image: trunk/legal-git:latest
    container_name: trunk-legal-git
    environment:
      # REQUIRED: Google OAuth (get from https://console.cloud.google.com/)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?Please set GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:?Please set GOOGLE_CLIENT_SECRET}

      # REQUIRED: Security (generate with: openssl rand -hex 32)
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Please set JWT_SECRET_KEY}

      # Optional: Customize for your firm
      - FIRM_NAME=${FIRM_NAME:-My Law Firm}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}

    ports:
      - "8080:8080"

    volumes:
      - trunk-data:/data

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    # Resource limits for small law firms
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  trunk-data:
    driver: local
