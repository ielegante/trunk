[supervisord]
nodaemon=true
user=root

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/trunk/nginx.log
stderr_logfile=/var/log/trunk/nginx_error.log

[program:trunk-backend]
command=python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
directory=/app/backend
user=trunk
autostart=true
autorestart=true
stdout_logfile=/var/log/trunk/backend.log
stderr_logfile=/var/log/trunk/backend_error.log
environment=PYTHONPATH="/app/backend"

[group:trunk]
programs=nginx,trunk-backend
