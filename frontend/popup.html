<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: 'Google Sans', Roboto, Arial, sans-serif;
      font-size: 14px;
      line-height: 1.4;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #dadce0;
    }

    .logo {
      width: 24px;
      height: 24px;
      fill: #1a73e8;
    }

    .title {
      font-size: 18px;
      font-weight: 500;
      color: #1f1f1f;
    }

    .status-section {
      margin-bottom: 16px;
    }

    .status-label {
      font-weight: 500;
      color: #5f6368;
      margin-bottom: 4px;
    }

    .status-value {
      color: #1f1f1f;
      margin-bottom: 8px;
    }

    .status-connected {
      color: #137333;
    }

    .status-disconnected {
      color: #d93025;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      transition: background-color 0.2s;
    }

    .btn-primary {
      background-color: #1a73e8;
      color: white;
    }

    .btn-primary:hover {
      background-color: #1557b0;
    }

    .btn-secondary {
      background-color: #f8f9fa;
      color: #1f1f1f;
      border: 1px solid #dadce0;
    }

    .btn-secondary:hover {
      background-color: #f1f3f4;
    }

    .btn:disabled {
      background-color: #f8f9fa;
      color: #9aa0a6;
      cursor: not-allowed;
    }

    .info-section {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #dadce0;
      font-size: 12px;
      color: #5f6368;
    }

    .info-link {
      color: #1a73e8;
      text-decoration: none;
    }

    .info-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg class="logo" viewBox="0 0 16 16">
      <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.03 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/>
    </svg>
    <span class="title">Legal Git</span>
  </div>

  <div class="status-section">
    <div class="status-label">Server Connection</div>
    <div id="server-status" class="status-value status-disconnected">Not configured</div>

    <div class="status-label">Current Page</div>
    <div id="page-status" class="status-value">Unknown</div>

    <div class="status-label">Document Status</div>
    <div id="document-status" class="status-value">Not tracked</div>
  </div>

  <div class="actions">
    <button id="configure-server" class="btn btn-primary">Configure Git Server</button>
    <button id="start-tracking" class="btn btn-secondary" disabled>Start Version Tracking</button>
    <button id="save-milestone" class="btn btn-secondary" disabled>Save Milestone</button>
    <button id="view-history" class="btn btn-secondary" disabled>View History</button>
  </div>

  <div class="info-section">
    <div style="margin-bottom: 8px;">
      <a href="#" id="options-link" class="info-link">Extension Options</a> |
      <a href="https://github.com/legal-git/legal-git" class="info-link" target="_blank">Documentation</a>
    </div>
    <div>Version 0.1.0 (Sprint 1)</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
